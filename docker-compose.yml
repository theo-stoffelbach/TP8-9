services:

  # ─── Catalog Service ───────────────────────────────────────────────────────
  catalog_db:
    image: postgres:15-alpine
    container_name: catalog_db
    restart: always
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_pass
    ports:
      - "5431:5432"
    volumes:
      - catalog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  catalog_web:
    build: ./catalog-service
    container_name: catalog_service
    hostname: catalog-web
    restart: always
    ports:
      - "8001:8001"
    environment:
      DATABASE_NAME: catalog_db
      DATABASE_USER: catalog_user
      DATABASE_PASSWORD: catalog_pass
      DATABASE_HOST: catalog_db
      DATABASE_PORT: 5432
    depends_on:
      catalog_db:
        condition: service_healthy

  # ─── Customers Service ─────────────────────────────────────────────────────
  customers_db:
    image: postgres:15-alpine
    container_name: customers_db
    restart: always
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: customer_user
      POSTGRES_PASSWORD: customer_password
    ports:
      - "5435:5432"
    volumes:
      - customers_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_user -d customer_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  customers_web:
    build: ./customers-sercice
    container_name: customers_service
    hostname: customers-web
    restart: always
    command: sh -c "python manage.py migrate && python manage.py shell -c 'from catalog.models import Customer; import sys; sys.exit(0 if Customer.objects.exists() else 1)' || python manage.py import_customers catalog_import_10k.json --skip-errors && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: customer_user
      POSTGRES_PASSWORD: customer_password
      DB_HOST: customers_db
      DB_PORT: 5432
      DJANGO_SECRET_KEY: change_me_in_dev
      DJANGO_DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,customers-web"
    depends_on:
      customers_db:
        condition: service_healthy

  # ─── Orders Service ────────────────────────────────────────────────────────
  orders_db:
    image: postgres:16-alpine
    container_name: orders_db
    restart: always
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
    ports:
      - "5433:5432"
    volumes:
      - orders_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  orders_web:
    build: ./orders-service
    container_name: orders_service
    hostname: orders-web
    restart: always
    command: sh -c "python manage.py migrate && python manage.py shell -c 'from orders.models import Order; import sys; sys.exit(0 if Order.objects.exists() else 1)' || python manage.py import_orders orders_import_20k.json --skip-errors && python manage.py runserver 0.0.0.0:8002"
    ports:
      - "8002:8002"
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_pass
      DB_HOST: orders_db
      DB_PORT: 5432
      DJANGO_SECRET_KEY: order_secret_key_123
      DJANGO_DEBUG: "True"
      ALLOWED_HOSTS: "localhost,127.0.0.1,orders-web"
      CATALOG_SERVICE_URL: http://catalog-web:8001
    depends_on:
      orders_db:
        condition: service_healthy

  # ─── BI Database ──────────────────────────────────────────────────────
  bi_db:
    image: postgres:15-alpine
    container_name: bi_db
    restart: always
    environment:
      POSTGRES_DB: bi_db
      POSTGRES_USER: bi_user
      POSTGRES_PASSWORD: bi_pass
    ports:
      - "5434:5432"
    volumes:
      - bi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_user -d bi_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── pgAdmin ─────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - catalog_db
      - customers_db
      - orders_db
      - bi_db

  # ─── Analytics DB (for Superset metadata if needed, but bi_db is used here) ────────
  analytics_db:
    image: postgres:15-alpine
    container_name: analytics_db
    restart: always
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_pass
    volumes:
      - analytics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user -d analytics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Superset ────────────────────────────────────────────────────────
  superset:
    image: apache/superset:latest
    container_name: superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: superset_secret_key_change_me
      TALISMAN_ENABLED: "False"
      WTF_CSRF_ENABLED: "False"
      SESSION_COOKIE_SAMESITE: Lax
      SESSION_COOKIE_SECURE: "False"
      SESSION_COOKIE_HTTPONLY: "True"
    volumes:
      - superset_data:/app/superset_home
      - ./analytics/superset-init.sh:/superset-init.sh
    command: ["/bin/bash", "/superset-init.sh"]
    depends_on:
      analytics_db:
        condition: service_healthy

  # ─── ETL Worker ──────────────────────────────────────────────────────
  etl:
    build: ./etl
    container_name: etl_worker
    # On attend 60s pour laisser le temps aux imports JSON de se terminer dans les autres services
    command: sh -c "echo 'Attente des imports...' && sleep 60 && python etl_sales.py"
    depends_on:
      catalog_web:
        condition: service_started
      customers_web:
        condition: service_started
      orders_web:
        condition: service_started
      bi_db:
        condition: service_healthy
    environment:
      CATALOG_DB_HOST: catalog_db
      CATALOG_DB_PORT: 5432
      CATALOG_DB_NAME: catalog_db
      CATALOG_DB_USER: catalog_user
      CATALOG_DB_PASSWORD: catalog_pass

      CUSTOMERS_DB_HOST: customers_db
      CUSTOMERS_DB_PORT: 5432
      CUSTOMERS_DB_NAME: customer_db
      CUSTOMERS_DB_USER: customer_user
      CUSTOMERS_DB_PASSWORD: customer_password

      ORDERS_DB_HOST: orders_db
      ORDERS_DB_PORT: 5432
      ORDERS_DB_NAME: order_db
      ORDERS_DB_USER: order_user
      ORDERS_DB_PASSWORD: order_pass

      BI_DB_HOST: bi_db
      BI_DB_PORT: 5432
      BI_DB_NAME: bi_db
      BI_DB_USER: bi_user
      BI_DB_PASSWORD: bi_pass

  # ─── Frontend ────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: zalandouille_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_CUSTOMER_URL: http://customers-web:8000
      VITE_ORDER_URL: http://orders-web:8002
      VITE_CATALOG_URL: http://catalog-web:8001
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - customers_web
      - catalog_web
      - orders_web

volumes:
  catalog_postgres_data:
  customers_postgres_data:
  orders_postgres_data:
  bi_postgres_data:
  pgadmin_data:
  analytics_postgres_data:
  superset_data:
